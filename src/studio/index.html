<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Remotion Studio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #d7dbe3;
    }
    .card {
      max-width: 520px;
      width: calc(100% - 48px);
      background: #171a21;
      border: 1px solid #2a3140;
      border-radius: 10px;
      padding: 22px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 600;
      color: #f5f7fa;
    }
    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.45;
      color: #aeb8cb;
    }
    a {
      color: #72b7ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening Remotion Studio...</h1>
    <p id="status">Redirecting to direct Studio view (no iframe).</p>
    <p style="margin-top:10px">
      If redirect does not happen, <a id="fallback" href="/_studio">open Studio</a>.
    </p>
  </div>

  <script>
    function toRemotionCompositionId(value) {
      return String(value || "").replace(/[^a-zA-Z0-9\-\u3000-\u9FFF]/g, "-");
    }

    var hashComp = location.hash ? decodeURIComponent(location.hash.slice(1)) : "";
    var compId = toRemotionCompositionId(hashComp);
    var target = compId ? ("/_studio/" + encodeURIComponent(compId)) : "/_studio";

    var fallback = document.getElementById("fallback");
    if (fallback) fallback.href = target;

    location.replace(target);
  </script>
</body>
</html>
