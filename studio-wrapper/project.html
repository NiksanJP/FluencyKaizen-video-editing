<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluencyKaizen Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 48px 32px;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card:hover {
      border-color: #444;
      background: #1a1a1a;
      transform: translateY(-1px);
    }

    .card:active {
      transform: translateY(0);
    }

    .card-title-ja {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-title-en {
      font-size: 14px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #555;
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge {
      display: inline-block;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: #666;
      font-family: "SF Mono", Monaco, monospace;
      margin-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #444;
    }

    .empty-state h2 {
      font-size: 20px;
      color: #555;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #444;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>FluencyKaizen Studio</h1>
      <p>Select a composition to open in the studio</p>
    </div>
    <div id="content">
      <div class="loading">Loading compositions...</div>
    </div>
  </div>

  <script>
    function el(tag, attrs, children) {
      var node = document.createElement(tag);
      if (attrs) {
        for (var k in attrs) {
          if (k === "className") node.className = attrs[k];
          else if (k === "textContent") node.textContent = attrs[k];
          else if (k === "href") node.setAttribute("href", attrs[k]);
          else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
          else node.setAttribute(k, attrs[k]);
        }
      }
      if (children) {
        for (var i = 0; i < children.length; i++) {
          var child = children[i];
          node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
        }
      }
      return node;
    }

    async function load() {
      var content = document.getElementById("content");
      try {
        var res = await fetch("/api/clips");
        var compositions = await res.json();

        content.textContent = "";

        if (compositions.length === 0) {
          content.appendChild(
            el("div", { className: "empty-state" }, [
              el("h2", { textContent: "No compositions found" }),
              el("p", { textContent: "Run /process-video to generate your first clip." }),
            ])
          );
          return;
        }

        var grid = el("div", { className: "grid" });

        for (var i = 0; i < compositions.length; i++) {
          var comp = compositions[i];
          var meta = el("div", { className: "card-meta" });
          if (comp.duration) meta.appendChild(el("span", { textContent: comp.duration + "s" }));
          meta.appendChild(el("span", { textContent: comp.subtitleCount + " subtitles" }));
          meta.appendChild(el("span", { textContent: comp.vocabCount + " vocab cards" }));

          var card = el("a", {
            className: "card",
            href: "/app/studio#" + encodeURIComponent(comp.id),
          }, [
            el("div", { className: "badge", textContent: comp.id }),
            el("div", { className: "card-title-ja", textContent: comp.hookTitle ? comp.hookTitle.ja : comp.id }),
            el("div", { className: "card-title-en", textContent: comp.hookTitle ? comp.hookTitle.en : "" }),
            meta,
          ]);

          grid.appendChild(card);
        }

        content.appendChild(grid);
      } catch (err) {
        content.textContent = "";
        content.appendChild(
          el("div", { className: "empty-state" }, [
            el("h2", { textContent: "Error loading compositions" }),
            el("p", { textContent: err.message }),
          ])
        );
      }
    }

    load();
  </script>
</body>
</html>
