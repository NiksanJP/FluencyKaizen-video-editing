<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluencyKaizen Studio</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css">
</head>
<body>
  <div class="container">
    <!-- Left: Remotion Studio -->
    <div class="preview-panel" id="previewPanel">
      <div class="loading-overlay" id="loadingOverlay">Loading Remotion Studio...</div>
      <iframe id="studioFrame" src="/remotion-studio"></iframe>
    </div>

    <!-- Draggable splitter -->
    <div class="splitter" id="splitter"></div>

    <!-- Right: AI Terminals -->
    <div class="terminal-panel" id="terminalPanel">
      <div class="tab-bar">
        <div class="tab claude active" data-target="claude" onclick="switchTab('claude')">Claude</div>
        <div class="tab gemini" data-target="gemini" onclick="switchTab('gemini')">Gemini</div>
      </div>
      <div class="terminal-container">
        <div class="terminal-wrapper active" id="terminal-claude"></div>
        <div class="terminal-wrapper" id="terminal-gemini"></div>
      </div>
      <div class="status-bar">
        <span>FluencyKaizen Studio</span>
        <span class="clip-name" id="clipName"></span>
      </div>
    </div>
  </div>

  <script type="module" src="/terminal.js"></script>
  <script>
    // Hide loading overlay when iframe loads
    const frame = document.getElementById('studioFrame');
    const overlay = document.getElementById('loadingOverlay');
    frame.addEventListener('load', () => overlay.classList.add('hidden'));

    // Draggable splitter
    const splitter = document.getElementById('splitter');
    const previewPanel = document.getElementById('previewPanel');
    const container = document.querySelector('.container');
    let isDragging = false;

    splitter.addEventListener('mousedown', (e) => {
      isDragging = true;
      splitter.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      // Prevent iframe from capturing mouse events while dragging
      frame.style.pointerEvents = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const pct = (e.clientX / container.offsetWidth) * 100;
      const clamped = Math.max(30, Math.min(80, pct));
      previewPanel.style.flex = `0 0 ${clamped}%`;
      // Trigger terminal resize
      window.dispatchEvent(new Event('resize'));
    });

    document.addEventListener('mouseup', () => {
      if (!isDragging) return;
      isDragging = false;
      splitter.classList.remove('dragging');
      document.body.style.cursor = '';
      frame.style.pointerEvents = '';
    });
  </script>
</body>
</html>
