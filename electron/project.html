<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FluencyKaizen Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .titlebar {
      height: 38px;
      flex-shrink: 0;
    }

    .page {
      height: calc(100vh - 38px);
      overflow-y: auto;
      padding: 0 48px 48px;
      -webkit-app-region: no-drag;
    }

    .header {
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      -webkit-app-region: no-drag;
    }

    .card:hover {
      border-color: #444;
      background: #1a1a1a;
      transform: translateY(-1px);
    }

    .card:active {
      transform: translateY(0);
    }

    .card-title-ja {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .card-title-en {
      font-size: 14px;
      color: #888;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .card-meta {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #555;
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge {
      display: inline-block;
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      color: #666;
      font-family: "SF Mono", Monaco, monospace;
      margin-bottom: 12px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #444;
    }

    .empty-state h2 {
      font-size: 20px;
      color: #555;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #444;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="titlebar"></div>
  <div class="page">
    <div class="header">
      <h1>Compositions</h1>
      <p>Select a composition to open in the studio</p>
    </div>
    <div id="content">
      <div class="loading">Loading compositions...</div>
    </div>
  </div>

  <script>
    function el(tag, attrs, children) {
      const node = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (k === "className") node.className = v;
          else if (k === "textContent") node.textContent = v;
          else if (k.startsWith("on")) node.addEventListener(k.slice(2).toLowerCase(), v);
          else node.setAttribute(k, v);
        }
      }
      if (children) {
        for (const child of children) {
          node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
        }
      }
      return node;
    }

    async function load() {
      const content = document.getElementById("content");
      const compositions = await window.studio.getCompositions();

      content.textContent = "";

      if (compositions.length === 0) {
        const empty = el("div", { className: "empty-state" }, [
          el("h2", { textContent: "No compositions found" }),
          el("p", { textContent: "Run /process-video to generate your first clip." }),
        ]);
        content.appendChild(empty);
        return;
      }

      const grid = el("div", { className: "grid" });

      for (const comp of compositions) {
        const meta = el("div", { className: "card-meta" });
        if (comp.duration) meta.appendChild(el("span", { textContent: comp.duration + "s" }));
        meta.appendChild(el("span", { textContent: comp.subtitleCount + " subtitles" }));
        meta.appendChild(el("span", { textContent: comp.vocabCount + " vocab cards" }));

        const card = el("div", {
          className: "card",
          onClick: () => window.studio.openComposition(comp.id),
        }, [
          el("div", { className: "badge", textContent: comp.id }),
          el("div", { className: "card-title-ja", textContent: comp.hookTitle.ja || comp.id }),
          el("div", { className: "card-title-en", textContent: comp.hookTitle.en || "" }),
          meta,
        ]);

        grid.appendChild(card);
      }

      content.appendChild(grid);
    }

    load();
  </script>
</body>
</html>
